$kind: http-request
name: My orders
description: "Generated from cURL: curl --location
  'http://localhost:5000/api/products' \\\r

  --header 'Authorization: Bearer YOUR_TOKEN' \\\r

  --form 'name=\"iPhone 15\"' \\\r

  --form 'description=\"Apple smartphone\"' \\\r

  --form 'price=\"69999\"' \\\r

  --form 'category=\"Electronics\"' \\\r

  --form 'stock=\"10\"' \\\r

  --form 'image=@\"/C:/Users/Vasu/Desktop/iphone.jpg\"'"
url: http://localhost:5000/api/products
method: POST
headers:
  Authorization: Bearer YOUR_TOKEN
body:
  type: formdata
  content:
    - type: text
      key: name
      value: iPhone 15
    - type: text
      key: description
      value: Apple smartphone
    - type: text
      key: price
      value: "69999"
    - type: text
      key: category
      value: Electronics
    - type: text
      key: stock
      value: "10"
    - type: file
      key: image
      src: /C:/Users/Vasu/Desktop/iphone.jpg
order: 1000
